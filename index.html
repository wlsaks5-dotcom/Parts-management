<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seegene Parts Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html5-qrcode 라이브러리 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        button, a, input, select, [onclick] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 flex flex-col items-center text-gray-800">

    <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-xl p-6 mb-6">
        
        <!-- 헤더 및 씨젠 로고 영역 -->
        <div class="text-center mb-6 border-b border-gray-100 pb-4">
            <div class="flex justify-center mb-3">
                <img src="https://www.seegene.com/images/common/logo.png" alt="Seegene Logo" class="h-8 object-contain">
            </div>
            <h1 class="text-xl font-bold tracking-tight text-gray-900">부품 관리 시스템</h1>
        </div>

        <!-- 1. 엔지니어 정보 표시 및 변경 -->
        <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-4">
            <p class="text-[11px] text-gray-500 font-medium">현재 등록된 사용자 (기기 소유자)</p>
            <div class="flex justify-between items-center mt-1">
                <span id="engineerNameDisplay" class="font-bold text-lg text-blue-600">미등록</span>
                <button onclick="changeEngineer()" class="text-xs bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 px-3 py-1.5 rounded-lg font-bold transition-all shadow-sm">변경</button>
            </div>
        </div>

        <!-- 2. 작업 모드 표시 및 모드 전환 (비밀번호: 1234) -->
        <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-[11px] text-gray-500 font-medium">현재 작업 모드</p>
                    <span id="workModeDisplay" class="font-bold text-base text-blue-600">📤 [사용 모드 - 부품 출고]</span>
                </div>
                <button onclick="toggleWorkMode()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-bold shadow transition-all">모드 변경</button>
            </div>
        </div>

        <!-- ================= [일반 모드 영역 (출고/입고 시 표시)] ================= -->
        <div id="userModeSection">
            <!-- 모바일용 QR 스캔 실행 버튼 -->
            <button onclick="startQrScanner()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold text-center text-lg mb-3 shadow-lg transition-all flex items-center justify-center gap-2">
                <span>📷</span> 부품 QR 스캔하기 (모바일용)
            </button>

            <!-- 카메라 화면 출력 영역 -->
            <div id="reader" class="rounded-xl overflow-hidden shadow-inner mb-3 border border-gray-200" style="display: none;"></div>

            <button id="stopBtn" onclick="stopScanner()" class="w-full bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 py-2.5 rounded-xl font-bold text-sm mb-4 transition-all shadow-sm" style="display: none;">
                ❌ 스캔 취소
            </button>

            <!-- PC 사용자용 직접 입력 영역 -->
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-3.5 mb-4">
                <label class="block text-[11px] font-bold text-gray-600 mb-1.5">💻 PC 직접 입력 (파트 넘버/부품 ID)</label>
                <div class="flex gap-2">
                    <input type="text" id="manualPartInput" placeholder="예: PART-001 입력" class="flex-1 text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-blue-500">
                    <button onclick="handleManualSubmit()" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2.5 rounded-lg text-xs font-bold transition-all shadow-sm">
                        처리
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= [관리자 등록 패널 (비밀번호 1234 입력 시 활성화)] ================= -->
        <div id="adminModeSection" style="display: none;" class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6">
            <h2 class="text-xs font-bold text-blue-800 mb-3 uppercase tracking-wider">🛠️ [관리자 모드] 정보 등록 패널</h2>

            <!-- 탭 전환 버튼 -->
            <div class="flex border-b border-blue-200 mb-4">
                <button onclick="switchAdminTab('part')" id="tabPartBtn" class="flex-1 py-2 text-xs font-bold text-blue-600 border-b-2 border-blue-600">부품 정보 등록</button>
                <button onclick="switchAdminTab('engineer')" id="tabEngBtn" class="flex-1 py-2 text-xs font-bold text-gray-500">엔지니어 등록</button>
            </div>

            <!-- 1) 부품 등록 폼 -->
            <div id="adminPartForm" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">파트 넘버 (부품 ID / QR 값)</label>
                    <input type="text" id="inputPartId" placeholder="예: PART-001" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">부품 이름 (Name)</label>
                    <input type="text" id="inputPartName" placeholder="예: STARlet Pipette Tip" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">초기 입고 수량</label>
                    <input type="number" id="inputPartStock" value="0" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="savePartToFirebase()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow transition-all">
                    💾 부품 정보 DB 등록
                </button>
            </div>

            <!-- 2) 엔지니어 등록 폼 -->
            <div id="adminEngForm" class="space-y-3" style="display: none;">
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">엔지니어 성명</label>
                    <input type="text" id="inputEngName" placeholder="예: 박진만" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-700 mb-1">소속 / 부서 / 담당 장비</label>
                    <input type="text" id="inputEngDept" placeholder="예: FSE / CFX96, STARlet" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="saveEngineerToFirebase()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow transition-all">
                    💾 엔지니어 정보 DB 등록
                </button>
            </div>
        </div>

        <!-- 최근 처리 내역 -->
        <div class="border-t border-gray-100 pt-4">
            <h2 class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">📋 최근 처리 내역</h2>
            <div id="historyLog" class="text-xs text-gray-600 space-y-1.5 bg-gray-50 p-3 rounded-xl max-h-40 overflow-y-auto border border-gray-200">
                데이터를 불러오는 중...
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "본인의_API_KEY_입력",
            authDomain: "본인의_AUTH_DOMAIN_입력",
            projectId: "parts-ba9df",
            storageBucket: "본인의_STORAGE_BUCKET_입력",
            messagingSenderId: "본인의_MESSAGING_SENDER_ID_입력",
            appId: "본인의_APP_ID_입력"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const ADMIN_PASSWORD = "1234";

        let currentEngineer = localStorage.getItem('registered_engineer') || '';
        let currentWorkMode = 'USE'; // 'USE'(출고), 'IN'(입고), 'ADMIN'(관리자 등록)
        let html5QrCode = null;

        window.addEventListener('DOMContentLoaded', () => {
            updateEngineerDisplay();
            loadRecentHistory();
        });

        function updateEngineerDisplay() {
            const display = document.getElementById('engineerNameDisplay');
            if (currentEngineer) {
                display.innerText = currentEngineer;
            } else {
                display.innerText = "미등록 (설정 필요)";
                checkEngineerRegistration();
            }
        }

        function checkEngineerRegistration() {
            if (!currentEngineer) {
                let name = prompt("사용 중인 엔지니어 성명을 입력하세요:");
                if (name && name.trim() !== "") {
                    currentEngineer = name.trim();
                    localStorage.setItem('registered_engineer', currentEngineer);
                    updateEngineerDisplay();
                } else {
                    alert("시스템을 이용하려면 사용자 등록이 필수입니다.");
                    checkEngineerRegistration();
                }
            }
        }

        function changeEngineer() {
            let name = prompt("변경할 엔지니어 성명을 입력하세요:", currentEngineer);
            if (name && name.trim() !== "") {
                currentEngineer = name.trim();
                localStorage.setItem('registered_engineer', currentEngineer);
                updateEngineerDisplay();
                alert(`사용자가 [${currentEngineer}]님으로 변경되었습니다.`);
            }
        }

        // 모드 순환: 출고(USE) ➔ 입고(IN) ➔ 관리자등록(ADMIN) ➔ 출고(USE)
        function toggleWorkMode() {
            let pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd !== ADMIN_PASSWORD) {
                alert("비밀번호가 틀렸습니다.");
                return;
            }

            const modeDisplay = document.getElementById('workModeDisplay');
            const userSection = document.getElementById('userModeSection');
            const adminSection = document.getElementById('adminModeSection');

            if (currentWorkMode === 'USE') {
                currentWorkMode = 'IN';
                modeDisplay.innerText = "📥 [입고 모드 - 재고 추가]";
                modeDisplay.className = "font-bold text-base text-green-600";
                userSection.style.display = 'block';
                adminSection.style.display = 'none';
                alert("입고 모드로 전환되었습니다.");
            } else if (currentWorkMode === 'IN') {
                currentWorkMode = 'ADMIN';
                modeDisplay.innerText = "🛠️ [관리자 모드 - 정보 등록]";
                modeDisplay.className = "font-bold text-base text-purple-600";
                userSection.style.display = 'none';
                adminSection.style.display = 'block';
                alert("관리자 등록 모드로 전환되었습니다. 부품 및 엔지니어 등록 폼이 활성화되었습니다.");
            } else {
                currentWorkMode = 'USE';
                modeDisplay.innerText = "📤 [사용 모드 - 부품 출고]";
                modeDisplay.className = "font-bold text-base text-blue-600";
                userSection.style.display = 'block';
                adminSection.style.display = 'none';
                alert("다시 사용(출고) 모드로 전환되었습니다.");
            }
        }

        function switchAdminTab(type) {
            const partForm = document.getElementById('adminPartForm');
            const engForm = document.getElementById('adminEngForm');
            const tabPartBtn = document.getElementById('tabPartBtn');
            const tabEngBtn = document.getElementById('tabEngBtn');

            if (type === 'part') {
                partForm.style.display = 'block';
                engForm.style.display = 'none';
                tabPartBtn.className = "flex-1 py-2 text-xs font-bold text-blue-600 border-b-2 border-blue-600";
                tabEngBtn.className = "flex-1 py-2 text-xs font-bold text-gray-500";
            } else {
                partForm.style.display = 'none';
                engForm.style.display = 'block';
                tabPartBtn.className = "flex-1 py-2 text-xs font-bold text-gray-500";
                tabEngBtn.className = "flex-1 py-2 text-xs font-bold text-blue-600 border-b-2 border-blue-600";
            }
        }

        async function savePartToFirebase() {
            const partId = document.getElementById('inputPartId').value.trim();
            const partName = document.getElementById('inputPartName').value.trim();
            const stock = parseInt(document.getElementById('inputPartStock').value) || 0;

            if (!partId || !partName) {
                alert("파트 넘버와 부품 이름을 모두 입력해주세요.");
                return;
            }

            try {
                await db.collection("parts").doc(partId).set({
                    partId: partId,
                    partName: partName,
                    stock: stock,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(`✅ 부품 등록 완료!\n- ID(QR): ${partId}\n- 이름: ${partName}\n- 수량: ${stock}`);
                document.getElementById('inputPartId').value = '';
                document.getElementById('inputPartName').value = '';
                document.getElementById('inputPartStock').value = '0';
            } catch (error) {
                console.error(error);
                alert("부품 저장 중 오류가 발생했습니다.");
            }
        }

        async function saveEngineerToFirebase() {
            const engName = document.getElementById('inputEngName').value.trim();
            const engDept = document.getElementById('inputEngDept').value.trim();

            if (!engName) {
                alert("엔지니어 성명을 입력해주세요.");
                return;
            }

            try {
                await db.collection("engineers").add({
                    name: engName,
                    department: engDept,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(`✅ 엔지니어 등록 완료!\n- 성명: ${engName}\n- 소속: ${engDept}`);
                document.getElementById('inputEngName').value = '';
                document.getElementById('inputEngDept').value = '';
            } catch (error) {
                console.error(error);
                alert("엔지니어 저장 중 오류가 발생했습니다.");
            }
        }

        function startQrScanner() {
            if (!currentEngineer) {
                checkEngineerRegistration();
                if (!currentEngineer) return;
            }

            const readerDiv = document.getElementById('reader');
            const stopBtn = document.getElementById('stopBtn');
            readerDiv.style.display = 'block';
            stopBtn.style.display = 'block';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    await stopScanner();
                    await handleScannedResult(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("카메라 권한을 확인해주세요.");
                readerDiv.style.display = 'none';
                stopBtn.style.display = 'none';
            });
        }

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
            }
            document.getElementById('reader').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
        }

        // PC 직접 입력 처리 버튼 클릭 시
        async function handleManualSubmit() {
            if (!currentEngineer) {
                checkEngineerRegistration();
                if (!currentEngineer) return;
            }

            const inputField = document.getElementById('manualPartInput');
            const partId = inputField.value.trim();

            if (!partId) {
                alert("파트 넘버(부품 ID)를 입력해주세요.");
                return;
            }

            await handleScannedResult(partId);
            inputField.value = ''; // 입력창 초기화
        }

        async function handleScannedResult(partId) {
            if (currentWorkMode === 'USE') {
                try {
                    await db.collection("usage_history").add({
                        partId: partId,
                        engineer: currentEngineer,
                        type: "USE",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        status: "사용완료"
                    });
                    alert(`✅ [사용 완료]\n엔지니어: ${currentEngineer}\n부품 ID: ${partId}`);
                    loadRecentHistory();
                } catch (error) {
                    alert("사용 데이터 전송 오류");
                }
            } else if (currentWorkMode === 'IN') {
                let qtyInput = prompt(`📦 [입고 처리 - 부품 ID: ${partId}]\n입고 수량 입력:`, "1");
                if (qtyInput && !isNaN(qtyInput)) {
                    let quantity = parseInt(qtyInput);
                    try {
                        await db.collection("inventory_logs").add({
                            partId: partId,
                            engineer: currentEngineer,
                            quantity: quantity,
                            type: "IN",
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        alert(`📦 [입고 완료]\n부품 ID: ${partId}\n수량: +${quantity}`);
                        loadRecentHistory();
                    } catch (error) {
                        alert("입고 데이터 전송 오류");
                    }
                }
            }
        }

        async function loadRecentHistory() {
            const logContainer = document.getElementById('historyLog');
            try {
                const snapshot = await db.collection("usage_history")
                    .orderBy("timestamp", "desc")
                    .limit(5)
                    .get();

                if (snapshot.empty) {
                    logContainer.innerHTML = "기록된 내역이 없습니다.";
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleTimeString() : '방금 전';
                    html += `<div class="py-1.5 border-b border-gray-100 flex justify-between">
                        <span><b>[${data.engineer}]</b> ${data.partId}</span>
                        <span class="text-gray-400">${date}</span>
                    </div>`;
                });
                logContainer.innerHTML = html;
            } catch (error) {
                logContainer.innerHTML = "내역을 불러오지 못했습니다.";
            }
        }
    </script>
</body>
</html>
