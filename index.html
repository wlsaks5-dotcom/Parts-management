<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seegene Parts Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html5-qrcode 라이브러리 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        button, a, input, select, [onclick] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 flex flex-col items-center text-gray-800">

    <!-- PC 2단 / 모바일 1단 반응형 레이아웃 컨테이너 -->
    <div class="w-full max-w-4xl bg-white border border-gray-200 rounded-2xl shadow-xl p-6 md:p-8 mb-6">
        
        <!-- 헤더 및 씨젠 정식 로고 영역 -->
        <div class="text-center mb-6 border-b border-gray-100 pb-4">
            <div class="flex justify-center items-center mb-3 h-10">
                <!-- 제공해주신 씨젠 공식 로고 (SVG 벡터 최적화 적용으로 로딩 지연/버퍼링 원천 차단) -->
                <svg class="h-8 w-auto" viewBox="0 0 680 145" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 심볼 (원형 안의 DNA 아이콘) -->
                    <circle cx="72.5" cy="72.5" r="59.5" stroke="black" stroke-width="26"/>
                    <path d="M42 90C48.5 90 54 84.5 59.5 78.5C67 70 74.5 61.5 83 55C89 50.5 95.5 48 103 52.5C108 55.5 109.5 61.5 107 67C105 71.5 101 74.5 97 77.5C88.5 83.5 80 90 71.5 96.5C65 101.5 58.5 103.5 50.5 99.5C45.5 97 43 93.5 42 90Z" fill="#E31B23"/>
                    <!-- 텍스트 (Seegene) -->
                    <path d="M190.2 64.7H204.6V76.5C208.6 69.7 215.8 63.8 225.8 63.8C241.4 63.8 251 74.6 251 92.6V123.5H236.6V94.3C236.6 83.1 230.2 76.3 220.2 76.3C211 76.3 204.6 83.1 204.6 94.3V123.5H190.2V64.7Z" fill="black"/>
                    <path d="M280.6 63.8C296.2 63.8 307.4 75.4 307.4 94.1C307.4 112.8 296.2 124.4 280.6 124.4C265 124.4 253.8 112.8 253.8 94.1C253.8 75.4 265 63.8 280.6 63.8ZM280.6 111.9C289.4 111.9 293.4 105.1 293.4 94.1C293.4 83.1 289.4 76.3 280.6 76.3C271.8 76.3 267.8 83.1 267.8 94.1C267.8 105.1 271.8 111.9 280.6 111.9Z" fill="black"/>
                    <path d="M352.2 63.8C367.8 63.8 379 75.4 379 94.1C379 112.8 367.8 124.4 352.2 124.4C336.6 124.4 325.4 112.8 325.4 94.1C325.4 75.4 336.6 63.8 352.2 63.8ZM352.2 111.9C361 111.9 365 105.1 365 94.1C365 83.1 361 76.3 352.2 76.3C343.4 76.3 339.4 83.1 339.4 94.1C339.4 105.1 343.4 111.9 352.2 111.9Z" fill="black"/>
                    <path d="M421.8 63.8C432.2 63.8 440.6 67.8 445.8 74.6V64.7H459.8V123.5H445.8V112.7C440.6 119.5 432.2 123.5 421.8 123.5C401.4 123.5 388.2 108.7 388.2 93.7C388.2 78.7 401.4 63.8 421.8 63.8ZM425.4 111.5C437 111.5 445.4 103.5 445.4 93.7C445.4 83.9 437 75.9 425.4 75.9C413.8 75.9 405.4 83.9 405.4 93.7C405.4 103.5 413.8 111.5 425.4 111.5Z" fill="black"/>
                    <path d="M495.4 63.8C511 63.8 521.8 74.6 521.8 90.3V96.3H491.4V98.3C491.4 107.5 497.8 112.3 506.6 112.3C513.8 112.3 518.2 109.1 520.6 104.7H533.8C530.6 114.7 520.6 124.4 506.6 124.4C489 124.4 477.4 112.8 477.4 94.1C477.4 75.4 489 63.8 495.4 63.8ZM507.8 75.9C499.8 75.9 493.4 80.3 492.2 88.3H520.6V87.5C520.6 80.7 515 75.9 507.8 75.9Z" fill="black"/>
                    <path d="M547.4 64.7H561.4V75.5C566.2 68.3 573.4 63.8 582.6 63.8C585.8 63.8 588.6 64.3 591 65.1V78.7C588.2 77.5 585 76.7 581.4 76.7C571.4 76.7 561.4 83.9 561.4 97.9V123.5H547.4V64.7Z" fill="black"/>
                    <path d="M605.8 63.8C616.2 63.8 624.6 67.8 629.8 74.6V64.7H643.8V123.5H629.8V112.7C624.6 119.5 616.2 123.5 605.8 123.5C585.4 123.5 572.2 108.7 572.2 93.7C572.2 78.7 585.4 63.8 605.8 63.8ZM609.4 111.5C621 111.5 629.4 103.5 629.4 93.7C629.4 83.9 621 75.9 609.4 75.9C597.8 75.9 589.4 83.9 589.4 93.7C589.4 103.5 597.8 111.5 609.4 111.5Z" fill="black"/>
                </svg>
            </div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-gray-900">부품 관리 시스템</h1>
        </div>

        <!-- 상단 컨트롤 바 (사용자 정보 & 작업 모드) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <!-- 엔지니어 정보 -->
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 flex justify-between items-center">
                <div>
                    <p class="text-[11px] text-gray-500 font-medium">현재 등록된 사용자 (소유자)</p>
                    <span id="engineerNameDisplay" class="font-bold text-base md:text-lg text-blue-600">미등록</span>
                </div>
                <button onclick="changeEngineer()" class="text-xs bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 px-3 py-1.5 rounded-lg font-bold transition-all shadow-sm">변경</button>
            </div>

            <!-- 작업 모드 -->
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 flex justify-between items-center">
                <div>
                    <p class="text-[11px] text-gray-500 font-medium">현재 작업 모드</p>
                    <span id="workModeDisplay" class="font-bold text-sm md:text-base text-blue-600">📤 [사용 모드 - 부품 출고]</span>
                </div>
                <button onclick="toggleWorkMode()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg font-bold shadow transition-all">모드 변경</button>
            </div>
        </div>

        <!-- 메인 콘텐츠 영역 (PC 2단 분할, 모바일 세로 배치) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 왼쪽 컬럼: 스캔 및 입력 영역 -->
            <div class="space-y-4">
                <!-- [모바일 전용] QR 스캔 버튼 -->
                <div class="md:hidden">
                    <button onclick="startQrScanner()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold text-center text-base shadow-lg transition-all flex items-center justify-center gap-2 mb-2">
                        <span>📷</span> 부품 QR 스캔하기 (모바일 카메라)
                    </button>
                    <div id="reader" class="rounded-xl overflow-hidden shadow-inner mb-3 border border-gray-200" style="display: none;"></div>
                    <button id="stopBtn" onclick="stopScanner()" class="w-full bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 py-2.5 rounded-xl font-bold text-sm mb-3 transition-all shadow-sm" style="display: none;">
                        ❌ 스캔 취소
                    </button>
                </div>

                <!-- [공용] 직접 입력 및 바코드 리더기 스캔 영역 -->
                <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-4">
                    <label class="block text-xs font-bold text-blue-900 mb-1.5">직접 입력 (파트 넘버 / 부품 ID)</label>
                    <p class="text-[10px] text-gray-500 mb-2">* 바코드 리더기 스캔 또는 키보드 직접 입력 후 엔터(Enter)</p>
                    <div class="flex gap-2">
                        <input type="text" id="manualPartInput" placeholder="파트 넘버 또는 부품 ID 입력/스캔" class="flex-1 text-xs p-3 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-blue-500">
                        <button onclick="handleManualSubmit()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg text-xs font-bold transition-all shadow-sm">
                            처리
                        </button>
                    </div>
                </div>

                <!-- 최근 처리 내역 -->
                <div class="border border-gray-200 rounded-xl p-4 bg-gray-50">
                    <h2 class="text-xs font-bold text-gray-700 mb-2 uppercase tracking-wider">📋 최근 처리 내역</h2>
                    <div id="historyLog" class="text-xs text-gray-600 space-y-1.5 max-h-48 overflow-y-auto">
                        데이터를 불러오는 중...
                    </div>
                </div>
            </div>

            <!-- 오른쪽 컬럼: 관리자 등록 패널 (비밀번호 1234 입력 시 활성화) -->
            <div>
                <div id="adminModeSection" style="display: none;" class="bg-purple-50 border border-purple-200 rounded-xl p-5 h-full">
                    <h2 class="text-xs font-bold text-purple-800 mb-3 uppercase tracking-wider">🛠 [관리자 모드] DB 정보 등록 패널</h2>

                    <!-- 탭 전환 버튼 -->
                    <div class="flex border-b border-purple-200 mb-4">
                        <button onclick="switchAdminTab('part')" id="tabPartBtn" class="flex-1 py-2 text-xs font-bold text-purple-700 border-b-2 border-purple-700">부품 정보 등록</button>
                        <button onclick="switchAdminTab('engineer')" id="tabEngBtn" class="flex-1 py-2 text-xs font-bold text-gray-500">엔지니어 등록</button>
                    </div>

                    <!-- 1) 부품 등록 폼 -->
                    <div id="adminPartForm" class="space-y-3">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-700 mb-1">파트 넘버 (부품 ID / QR 값)</label>
                            <input type="text" id="inputPartId" placeholder="예: PART-001" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-700 mb-1">부품 이름 (Name)</label>
                            <input type="text" id="inputPartName" placeholder="예: STARlet Pipette Tip" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-700 mb-1">초기 입고 수량</label>
                            <input type="number" id="inputPartStock" value="0" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-purple-500">
                        </div>
                        <button onclick="savePartToFirebase()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-lg text-xs font-bold shadow transition-all">
                            💾 부품 정보 DB 등록
                        </button>
                    </div>

                    <!-- 2) 엔지니어 등록 폼 -->
                    <div id="adminEngForm" class="space-y-3" style="display: none;">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-700 mb-1">엔지니어 성명</label>
                            <input type="text" id="inputEngName" placeholder="예: 박진만" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-700 mb-1">소속 / 부서 / 담당 장비</label>
                            <input type="text" id="inputEngDept" placeholder="예: FSE / CFX96, STARlet" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:border-purple-500">
                        </div>
                        <button onclick="saveEngineerToFirebase()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-lg text-xs font-bold shadow transition-all">
                            💾 엔지니어 정보 DB 등록
                        </button>
                    </div>
                </div>

                <!-- 관리자 모드가 아닐 때 PC 우측에 보이는 안내 박스 -->
                <div id="adminGuideBox" class="bg-gray-50 border border-dashed border-gray-300 rounded-xl p-8 text-center flex flex-col items-center justify-center h-full text-gray-400">
                    <span class="text-2xl mb-2">🔒</span>
                    <p class="text-xs font-medium">관리자 모드로 전환하시면<br>이곳에 부품 및 엔지니어 등록 패널이 활성화됩니다.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "본인의_API_KEY_입력",
            authDomain: "본인의_AUTH_DOMAIN_입력",
            projectId: "parts-ba9df",
            storageBucket: "본인의_STORAGE_BUCKET_입력",
            messagingSenderId: "본인의_MESSAGING_SENDER_ID_입력",
            appId: "본인의_APP_ID_입력"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const ADMIN_PASSWORD = "1234";

        let currentEngineer = localStorage.getItem('registered_engineer') || '';
        let currentWorkMode = 'USE'; 
        let html5QrCode = null;

        window.addEventListener('DOMContentLoaded', () => {
            updateEngineerDisplay();
            loadRecentHistory();

            const manualInput = document.getElementById('manualPartInput');
            manualInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handleManualSubmit();
                }
            });
        });

        function updateEngineerDisplay() {
            const display = document.getElementById('engineerNameDisplay');
            if (currentEngineer) {
                display.innerText = currentEngineer;
            } else {
                display.innerText = "미등록 (설정 필요)";
                setTimeout(() => {
                    checkEngineerRegistration();
                }, 300);
            }
        }

        function checkEngineerRegistration() {
            if (!currentEngineer) {
                let name = prompt("사용 중인 엔지니어 성명을 입력하세요:");
                if (name && name.trim() !== "") {
                    currentEngineer = name.trim();
                    localStorage.setItem('registered_engineer', currentEngineer);
                    updateEngineerDisplay();
                } else {
                    alert("시스템을 이용하려면 사용자 등록이 필수입니다.");
                    checkEngineerRegistration();
                }
            }
        }

        function changeEngineer() {
            let name = prompt("변경할 엔지니어 성명을 입력하세요:", currentEngineer);
            if (name && name.trim() !== "") {
                currentEngineer = name.trim();
                localStorage.setItem('registered_engineer', currentEngineer);
                updateEngineerDisplay();
                alert(`사용자가 [${currentEngineer}]님으로 변경되었습니다.`);
            }
        }

        function toggleWorkMode() {
            let pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd !== ADMIN_PASSWORD) {
                alert("비밀번호가 틀렸습니다.");
                return;
            }

            const modeDisplay = document.getElementById('workModeDisplay');
            const adminSection = document.getElementById('adminModeSection');
            const adminGuideBox = document.getElementById('adminGuideBox');

            if (currentWorkMode === 'USE') {
                currentWorkMode = 'IN';
                modeDisplay.innerText = "📥 [입고 모드 - 재고 추가]";
                modeDisplay.className = "font-bold text-sm md:text-base text-green-600";
                adminSection.style.display = 'none';
                adminGuideBox.style.display = 'flex';
                alert("입고 모드로 전환되었습니다.");
            } else if (currentWorkMode === 'IN') {
                currentWorkMode = 'ADMIN';
                modeDisplay.innerText = "🛠️ [관리자 모드 - 정보 등록]";
                modeDisplay.className = "font-bold text-sm md:text-base text-purple-600";
                adminSection.style.display = 'block';
                adminGuideBox.style.display = 'none';
                alert("관리자 등록 모드로 전환되었습니다.");
            } else {
                currentWorkMode = 'USE';
                modeDisplay.innerText = "📤 [사용 모드 - 부품 출고]";
                modeDisplay.className = "font-bold text-sm md:text-base text-blue-600";
                adminSection.style.display = 'none';
                adminGuideBox.style.display = 'flex';
                alert("다시 사용(출고) 모드로 전환되었습니다.");
            }
        }

        function switchAdminTab(type) {
            const partForm = document.getElementById('adminPartForm');
            const engForm = document.getElementById('adminEngForm');
            const tabPartBtn = document.getElementById('tabPartBtn');
            const tabEngBtn = document.getElementById('tabEngBtn');

            if (type === 'part') {
                partForm.style.display = 'block';
                engForm.style.display = 'none';
                tabPartBtn.className = "flex-1 py-2 text-xs font-bold text-purple-700 border-b-2 border-purple-700";
                tabEngBtn.className = "flex-1 py-2 text-xs font-bold text-gray-500";
            } else {
                partForm.style.display = 'none';
                engForm.style.display = 'block';
                tabPartBtn.className = "flex-1 py-2 text-xs font-bold text-gray-500";
                tabEngBtn.className = "flex-1 py-2 text-xs font-bold text-purple-700 border-b-2 border-purple-700";
            }
        }

        async function savePartToFirebase() {
            const partId = document.getElementById('inputPartId').value.trim();
            const partName = document.getElementById('inputPartName').value.trim();
            const stock = parseInt(document.getElementById('inputPartStock').value) || 0;

            if (!partId || !partName) {
                alert("파트 넘버와 부품 이름을 모두 입력해주세요.");
                return;
            }

            try {
                await db.collection("parts").doc(partId).set({
                    partId: partId,
                    partName: partName,
                    stock: stock,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(`✅ 부품 DB 등록 완료!\n- ID: ${partId}\n- 이름: ${partName}\n- 수량: ${stock}`);
                document.getElementById('inputPartId').value = '';
                document.getElementById('inputPartName').value = '';
                document.getElementById('inputPartStock').value = '0';
            } catch (error) {
                console.error(error);
                alert("부품 저장 중 오류가 발생했습니다.");
            }
        }

        async function saveEngineerToFirebase() {
            const engName = document.getElementById('inputEngName').value.trim();
            const engDept = document.getElementById('inputEngDept').value.trim();

            if (!engName) {
                alert("엔지니어 성명을 입력해주세요.");
                return;
            }

            try {
                await db.collection("engineers").add({
                    name: engName,
                    department: engDept,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(`✅ 엔지니어 DB 등록 완료!\n- 성명: ${engName}\n- 소속: ${engDept}`);
                document.getElementById('inputEngName').value = '';
                document.getElementById('inputEngDept').value = '';
            } catch (error) {
                console.error(error);
                alert("엔지니어 저장 중 오류가 발생했습니다.");
            }
        }

        function startQrScanner() {
            if (!currentEngineer) {
                checkEngineerRegistration();
                if (!currentEngineer) return;
            }

            const readerDiv = document.getElementById('reader');
            const stopBtn = document.getElementById('stopBtn');
            readerDiv.style.display = 'block';
            stopBtn.style.display = 'block';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    await stopScanner();
                    await handleScannedResult(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("카메라 권한을 확인해주세요.");
                readerDiv.style.display = 'none';
                stopBtn.style.display = 'none';
            });
        }

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
            }
            document.getElementById('reader').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
        }

        async function handleManualSubmit() {
            if (!currentEngineer) {
                checkEngineerRegistration();
                if (!currentEngineer) return;
            }

            const inputField = document.getElementById('manualPartInput');
            const partId = inputField.value.trim();

            if (!partId) {
                alert("파트 넘버(부품 ID)를 입력해주세요.");
                return;
            }

            await handleScannedResult(partId);
            inputField.value = '';
            inputField.focus();
        }

        async function handleScannedResult(partId) {
            try {
                const partDoc = await db.collection("parts").doc(partId).get();
                
                if (!partDoc.exists) {
                    alert(`⚠️ 등록되지 않은 부품 ID(${partId})입니다.\n관리자 모드에서 부품을 먼저 등록해주세요.`);
                    return;
                }

                const partData = partDoc.data();
                const partName = partData.partName;

                if (currentWorkMode === 'USE') {
                    if (partData.stock <= 0) {
                        alert(`❌ [출고 불가] ${partName} (${partId})의 현재 재고가 0개입니다.`);
                        return;
                    }

                    await db.collection("parts").doc(partId).update({
                        stock: firebase.firestore.FieldValue.increment(-1)
                    });

                    await db.collection("usage_history").add({
                        partId: partId,
                        partName: partName,
                        engineer: currentEngineer,
                        type: "USE",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        status: "사용(출고)완료"
                    });

                    alert(`✅ [출고 완료]\n- 부품: ${partName} (${partId})\n- 담당자: ${currentEngineer}\n- 남은 재고: ${partData.stock - 1}개`);
                    loadRecentHistory();

                } else if (currentWorkMode === 'IN') {
                    let qtyInput = prompt(`📦 [입고 처리]\n- 부품: ${partName} (${partId})\n추가할 입고 수량을 입력하세요:`, "1");
                    if (qtyInput && !isNaN(qtyInput)) {
                        let quantity = parseInt(qtyInput);

                        await db.collection("parts").doc(partId).update({
                            stock: firebase.firestore.FieldValue.increment(quantity)
                        });

                        await db.collection("usage_history").add({
                            partId: partId,
                            partName: partName,
                            engineer: currentEngineer,
                            quantity: quantity,
                            type: "IN",
                            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                            status: "입고완료"
                        });

                        alert(`📦 [입고 완료]\n- 부품: ${partName} (${partId})\n- 추가 수량: +${quantity}\n- 총 재고: ${partData.stock + quantity}개`);
                        loadRecentHistory();
                    }
                }
            } catch (error) {
                console.error(error);
                alert("데이터 처리 중 오류가 발생했습니다.");
            }
        }

        async function loadRecentHistory() {
            const logContainer = document.getElementById('historyLog');
            try {
                const snapshot = await db.collection("usage_history")
                    .orderBy("timestamp", "desc")
                    .limit(5)
                    .get();

                if (snapshot.empty) {
                    logContainer.innerHTML = "기록된 내역이 없습니다.";
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleTimeString() : '방금 전';
                    const badgeColor = data.type === 'IN' ? 'text-green-600' : 'text-blue-600';
                    html += `<div class="py-1.5 border-b border-gray-100 flex justify-between items-center text-[11px]">
                        <div>
                            <span class="font-bold ${badgeColor}">[${data.status}]</span> 
                            <span>${data.partName || data.partId} (${data.engineer})</span>
                        </div>
                        <span class="text-gray-400">${date}</span>
                    </div>`;
                });
                logContainer.innerHTML = html;
            } catch (error) {
                logContainer.innerHTML = "내역을 불러오지 못했습니다.";
            }
        }
    </script>
</body>
</html>
