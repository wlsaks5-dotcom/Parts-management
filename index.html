<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부품 관리 및 출입고 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html5-qrcode 라이브러리 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Firebase SDK (v8 호환) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased p-4">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- 상단 헤더 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <h1 class="text-base font-bold text-purple-900">📦 부품 출입고 및 QR 관리</h1>
            <button onclick="openAdminPanel()" class="bg-purple-100 text-purple-700 px-3 py-1.5 rounded-lg text-xs font-bold">관리자 모드</button>
        </div>

        <!-- [출입고 화면] 메인 영역 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm space-y-4">
            <h2 class="text-xs font-bold text-gray-600">부품 출입고 처리</h2>
            
            <!-- 검색 및 QR 스캔 입력부 -->
            <div class="relative space-y-2">
                <div class="flex gap-2">
                    <input type="text" id="manualPartInput" placeholder="부품 이름 또는 파트넘버 입력" class="w-full text-xs p-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500" autocomplete="off">
                    <button type="button" onclick="startQrScannerForAction()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap">
                        📷 QR 스캔
                    </button>
                </div>
                
                <!-- 출고 화면용 QR 카메라 뷰어 영역 -->
                <div id="action-qr-container" style="display: none;" class="border border-blue-300 rounded-lg p-2 bg-blue-50">
                    <div id="action-reader" style="width: 100%;"></div>
                    <button type="button" onclick="stopQrScannerForAction()" class="mt-2 w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-1.5 rounded text-xs font-bold">
                        스캔 취소 (닫기)
                    </button>
                </div>
            </div>

            <input type="hidden" id="selectedPartId">
            <input type="text" id="selectedPartTypeDisplay" readonly placeholder="선택된 부품 정보" class="w-full text-xs p-3 bg-gray-50 border border-gray-200 rounded-lg text-gray-500 font-bold">

            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="actionQuantity" value="1" placeholder="수량" class="w-full text-xs p-3 border border-gray-300 rounded-lg">
                <select id="actionType" class="w-full text-xs p-3 border border-gray-300 rounded-lg">
                    <option value="IN">입고 (IN)</option>
                    <option value="OUT">출고 (OUT)</option>
                </select>
            </div>

            <button onclick="processInventoryAction()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-lg text-xs font-bold shadow">
                🚀 출입고 처리 실행
            </button>
        </div>

    </div>

    <!-- [관리자 모드 패널] 모달 -->
    <div id="adminPanelModal" class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-purple-900">🛠️ 관리자 부품 등록 및 관리</h3>
                <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-gray-600 font-bold text-sm">✕</button>
            </div>

            <!-- 신규 부품 등록 폼 -->
            <div class="space-y-3 p-3 bg-purple-50 rounded-xl">
                <p class="text-[11px] font-bold text-purple-800">개별 부품 추가 (큐알 정보 포함)</p>
                <input type="text" id="inputPartName" placeholder="부품 이름 (예: Pad Assembly)" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg">
                
                <div class="flex gap-2">
                    <input type="text" id="inputPartId" placeholder="파트 넘버 또는 QR 스캔값" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg">
                    <button type="button" onclick="startQrScannerForAdmin()" class="bg-purple-200 hover:bg-purple-300 text-purple-800 px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap">
                        📷 QR 스캔
                    </button>
                </div>

                <!-- 등록 화면용 QR 카메라 뷰어 영역 -->
                <div id="qr-reader-container" style="display: none;" class="border border-purple-300 rounded-lg p-2 bg-white">
                    <div id="reader" style="width: 100%;"></div>
                    <button type="button" onclick="stopQrScannerForAdmin()" class="mt-2 w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-1.5 rounded text-xs font-bold">
                        스캔 취소 (닫기)
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="inputPartStock" value="0" placeholder="초기 수량" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg">
                    <select id="inputPartType" class="w-full text-xs p-2.5 bg-white border border-gray-300 rounded-lg">
                        <option value="new part">new part</option>
                        <option value="test part">test part</option>
                    </select>
                </div>
                <button onclick="savePartToFirebase()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-lg text-xs font-bold">
                    💾 개별 부품 DB 등록
                </button>
            </div>

            <!-- 등록된 부품 목록 (클릭 시 수정 모달 연동) -->
            <div>
                <p class="text-[11px] font-bold text-gray-600 mb-2">등록된 부품 목록 (수정하려면 행을 클릭하세요)</p>
                <div class="max-h-48 overflow-y-auto border border-gray-200 rounded-lg">
                    <table class="w-full text-left text-xs">
                        <tbody id="adminPartsTableBody">
                            <!-- JS로 동적 로드 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- [부품 정보 및 QR 연동 수정 모달] -->
    <div id="adminPartEditModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-sm font-bold text-purple-900">✏️ 부품 정보 및 QR 연동 수정</h3>
            <input type="hidden" id="editDocId">
            
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">파트 넘버 (시스템 ID)</label>
                <input type="text" id="modalEditPartId" readonly class="w-full text-xs p-2.5 bg-gray-100 border border-gray-300 rounded-lg text-gray-600 font-bold">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">부품 이름</label>
                <input type="text" id="modalEditPartName" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">QR 코드 고유 정보 (인식 값)</label>
                <div class="flex gap-2">
                    <input type="text" id="modalEditPartQrCode" placeholder="스캔 또는 직접 입력" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg">
                    <button type="button" onclick="startQrScannerForEdit()" class="bg-purple-100 hover:bg-purple-200 text-purple-700 px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap">
                        📷 QR 스캔
                    </button>
                </div>
            </div>

            <!-- 수정 모달 내 QR 카메라 뷰어 영역 -->
            <div id="edit-qr-container" style="display: none;" class="border border-purple-300 rounded-lg p-2 bg-purple-50">
                <div id="edit-reader" style="width: 100%;"></div>
                <button type="button" onclick="stopQrScannerForEdit()" class="mt-2 w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-1.5 rounded text-xs font-bold">
                    스캔 취소 (닫기)
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">재고 수량</label>
                    <input type="number" id="modalEditPartStock" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">파트 유형</label>
                    <select id="modalEditPartType" class="w-full text-xs p-2.5 border border-gray-300 rounded-lg">
                        <option value="new part">new part</option>
                        <option value="test part">test part</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveAdminPartEdit()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-lg text-xs font-bold">수정 완료</button>
                <button onclick="closeAdminPartEditModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2.5 rounded-lg text-xs font-bold">취소</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 로직 -->
    <script>
        // 파이어베이스 초기화 (사용 중이신 본인의 설정 정보로 교체해 주세요)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let partsCache = [];
        let html5QrCodeAdmin = null;
        let html5QrCodeAction = null;
        let html5QrCodeEdit = null;

        // 페이지 로드 시 부품 캐시 미리 불러오기
        window.addEventListener('DOMContentLoaded', () => {
            preloadPartsCache();
        });

        async function preloadPartsCache() {
            try {
                const snapshot = await db.collection("parts").get();
                partsCache = [];
                snapshot.forEach(doc => {
                    partsCache.push({ id: doc.id, ...doc.data() });
                });
            } catch (err) {
                console.error("부품 캐시 로드 실패:", err);
            }
        }

        // 1. 관리자 등록 탭 QR 스캔
        function startQrScannerForAdmin() {
            const container = document.getElementById('qr-reader-container');
            container.style.display = 'block';
            if (!html5QrCodeAdmin) {
                html5QrCodeAdmin = new Html5Qrcode("reader");
            }
            html5QrCodeAdmin.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    document.getElementById('inputPartId').value = decodedText;
                    stopQrScannerForAdmin();
                }, () => {}
            ).catch(err => {
                console.error("카메라 시작 실패:", err);
                container.style.display = 'none';
            });
        }

        function stopQrScannerForAdmin() {
            const container = document.getElementById('qr-reader-container');
            if (html5QrCodeAdmin) {
                html5QrCodeAdmin.stop().then(() => { container.style.display = 'none'; }).catch(() => { container.style.display = 'none'; });
            } else {
                container.style.display = 'none';
            }
        }

        // 2. 출입고 화면 QR 스캔
        function startQrScannerForAction() {
            const container = document.getElementById('action-qr-container');
            container.style.display = 'block';
            if (!html5QrCodeAction) {
                html5QrCodeAction = new Html5Qrcode("action-reader");
            }
            html5QrCodeAction.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    const matchedPart = partsCache.find(p => p.id === decodedText || (p.qrCode && p.qrCode === decodedText));
                    if (matchedPart) {
                        selectPartItem(matchedPart.id, matchedPart.name, matchedPart.type || 'new part');
                        alert(`부품 연동 성공: ${matchedPart.name}`);
                    } else {
                        document.getElementById('manualPartInput').value = decodedText;
                        document.getElementById('selectedPartId').value = decodedText;
                        document.getElementById('selectedPartTypeDisplay').value = `미등록 파트 (${decodedText})`;
                        alert(`⚠️ 등록되지 않은 QR 코드입니다. 관리자 모드에서 먼저 등록해주세요.`);
                    }
                    stopQrScannerForAction();
                }, () => {}
            ).catch(err => {
                console.error("카메라 시작 실패:", err);
                container.style.display = 'none';
            });
        }

        function stopQrScannerForAction() {
            const container = document.getElementById('action-qr-container');
            if (html5QrCodeAction) {
                html5QrCodeAction.stop().then(() => { container.style.display = 'none'; }).catch(() => { container.style.display = 'none'; });
            } else {
                container.style.display = 'none';
            }
        }

        function selectPartItem(id, name, type) {
            document.getElementById('selectedPartId').value = id;
            document.getElementById('manualPartInput').value = name;
            document.getElementById('selectedPartTypeDisplay').value = `${name} (${type})`;
        }

        // 3. 관리자 패널 제어
        function openAdminPanel() {
            document.getElementById('adminPanelModal').style.display = 'flex';
            loadRegisteredPartsList();
        }

        function closeAdminPanel() {
            document.getElementById('adminPanelModal').style.display = 'none';
        }

        async function loadRegisteredPartsList() {
            const tbody = document.getElementById('adminPartsTableBody');
            tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">불러오는 중...</td></tr>`;
            try {
                const snapshot = await db.collection("parts").get();
                tbody.innerHTML = '';
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">등록된 부품이 없습니다.</td></tr>`;
                    return;
                }
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const qrVal = data.qrCode || '';
                    tbody.innerHTML += `
                        <tr onclick="openAdminPartEditModal('${doc.id}', '${data.name}', ${data.stock || 0}, '${data.type || 'new part'}', '${qrVal}')" class="border-b hover:bg-purple-50 cursor-pointer">
                            <td class="p-2.5 font-bold">${doc.id}</td>
                            <td class="p-2.5">${data.name}</td>
                            <td class="p-2.5 text-right"><span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-1 rounded font-bold">수정</span></td>
                        </tr>`;
                });
            } catch (err) {
                console.error("목록 로드 실패:", err);
            }
        }

        // 신규 부품 등록
        async function savePartToFirebase() {
            const name = document.getElementById('inputPartName').value.trim();
            const id = document.getElementById('inputPartId').value.trim();
            const stock = parseInt(document.getElementById('inputPartStock').value) || 0;
            const type = document.getElementById('inputPartType').value;

            if (!name || !id) {
                alert("부품 이름과 파트 넘버(QR값)를 모두 입력해주세요.");
                return;
            }

            try {
                await db.collection("parts").doc(id).set({
                    name,
                    stock,
                    type,
                    qrCode: id, // 최초 등록 시 파트넘버를 기본 QR값으로 지정
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("부품이 등록되었습니다.");
                document.getElementById('inputPartName').value = '';
                document.getElementById('inputPartId').value = '';
                document.getElementById('inputPartStock').value = '0';
                loadRegisteredPartsList();
                preloadPartsCache();
            } catch (err) {
                console.error("등록 실패:", err);
                alert("등록 중 오류가 발생했습니다.");
            }
        }

        // 4. 수정 모달 열기 및 QR 스캔
        function openAdminPartEditModal(id, name, stock, type, qrCode) {
            document.getElementById('editDocId').value = id;
            document.getElementById('modalEditPartId').value = id;
            document.getElementById('modalEditPartName').value = name;
            document.getElementById('modalEditPartStock').value = stock;
            document.getElementById('modalEditPartType').value = type;
            document.getElementById('modalEditPartQrCode').value = qrCode || '';
            document.getElementById('adminPartEditModal').style.display = 'flex';
        }

        function startQrScannerForEdit() {
            const container = document.getElementById('edit-qr-container');
            container.style.display = 'block';
            if (!html5QrCodeEdit) {
                html5QrCodeEdit = new Html5Qrcode("edit-reader");
            }
            html5QrCodeEdit.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    document.getElementById('modalEditPartQrCode').value = decodedText;
                    stopQrScannerForEdit();
                }, () => {}
            ).catch(err => {
                console.error("카메라 시작 실패:", err);
                container.style.display = 'none';
            });
        }

        function stopQrScannerForEdit() {
            const container = document.getElementById('edit-qr-container');
            if (html5QrCodeEdit) {
                html5QrCodeEdit.stop().then(() => { container.style.display = 'none'; }).catch(() => { container.style.display = 'none'; });
            } else {
                container.style.display = 'none';
            }
        }

        function closeAdminPartEditModal() {
            stopQrScannerForEdit();
            document.getElementById('adminPartEditModal').style.display = 'none';
        }

        async function saveAdminPartEdit() {
            const id = document.getElementById('editDocId').value;
            const name = document.getElementById('modalEditPartName').value.trim();
            const stock = parseInt(document.getElementById('modalEditPartStock').value) || 0;
            const type = document.getElementById('modalEditPartType').value;
            const qrCode = document.getElementById('modalEditPartQrCode').value.trim();

            if (!name) {
                alert("부품 이름을 입력해주세요.");
                return;
            }

            try {
                await db.collection("parts").doc(id).update({
                    name,
                    stock,
                    type,
                    qrCode,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("부품 정보 및 QR 연동이 수정되었습니다.");
                closeAdminPartEditModal();
                loadRegisteredPartsList();
                preloadPartsCache();
            } catch (error) {
                console.error("수정 실패:", error);
                alert("수정 중 오류가 발생했습니다.");
            }
        }

        // 5. 출입고 처리 실행 함수
        async function processInventoryAction() {
            const partId = document.getElementById('selectedPartId').value;
            const qty = parseInt(document.getElementById('actionQuantity').value) || 0;
            const type = document.getElementById('actionType').value;

            if (!partId) {
                alert("출입고할 부품을 선택하거나 QR 코드를 스캔해주세요.");
                return;
            }
            if (qty <= 0) {
                alert("수량은 1 이상이어야 합니다.");
                return;
            }

            try {
                const partRef = db.collection("parts").doc(partId);
                const doc = await partRef.get();
                if (!doc.exists) {
                    alert("존재하지 않는 부품입니다.");
                    return;
                }

                const currentStock = doc.data().stock || 0;
                let newStock = type === 'IN' ? currentStock + qty : currentStock - qty;

                if (newStock < 0) {
                    alert("재고가 부족하여 출고할 수 없습니다.");
                    return;
                }

                // 트랜잭션 또는 업데이트 처리
                await partRef.update({ stock: newStock });
                await db.collection("history").add({
                    partId,
                    partName: doc.data().name,
                    quantity: qty,
                    type,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert(`성공적으로 처리되었습니다. (현재 재고: ${newStock})`);
                document.getElementById('selectedPartId').value = '';
                document.getElementById('manualPartInput').value = '';
                document.getElementById('selectedPartTypeDisplay').value = '';
                preloadPartsCache();
            } catch (err) {
                console.error("출입고 처리 실패:", err);
                alert("처리 중 오류가 발생했습니다.");
            }
        }
    </script>
</body>
</html>
